<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Single 3D Dice Drop</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    :root {
      --felt-bg: #143521;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #2e1509 0%, #110703 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: sans-serif;
    }
    .dice-tray {
      width: 320px;
      height: 260px;
      background: var(--felt-bg);
      border: 10px solid #3a1a0b;
      border-radius: 16px;
      box-shadow: inset 0 0 35px rgba(0,0,0,0.85), 0 12px 30px rgba(0,0,0,0.8);
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }
    #webgl-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .ui-area {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .roll-trigger-btn {
      padding: 12px 36px;
      background: linear-gradient(180deg, #e8ca74 0%, #b88628 100%);
      color: #1a0b02;
      font-size: 1.1rem;
      font-weight: 900;
      border: 1px solid #fff2b2;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(212,175,55,0.4);
      transition: transform 0.1s;
    }
    .roll-trigger-btn:active {
      transform: scale(0.96);
    }
    .result-label {
      color: #f0ebd8;
      font-size: 1.1rem;
      font-weight: 700;
      min-height: 26px;
    }
  </style>
</head>
<body>

  <div class="dice-tray" id="tray">
    <canvas id="webgl-canvas"></canvas>
  </div>

  <div class="ui-area">
    <button class="roll-trigger-btn" id="roll-btn">サイコロを振る</button>
    <div class="result-label" id="result-text">ボタンを押してサイコロを振ってください</div>
  </div>

  <script>
    // Web Audio 着地音
    const AudioEngine = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AC();
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
      },
      playHit(vol = 0.3, pitch = 140) {
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(pitch + (Math.random() * 30 - 15), now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.05);

        gain.gain.setValueAtTime(vol, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + 0.05);
      }
    };

    // テクスチャ生成（完全マット・光の反射なし）
    function createDiceFaceTexture(val) {
      const c = document.createElement('canvas');
      c.width = 256;
      c.height = 256;
      const ctx = c.getContext('2d');

      ctx.fillStyle = '#f8f8fa';
      ctx.fillRect(0, 0, 256, 256);

      ctx.strokeStyle = '#d2d5dc';
      ctx.lineWidth = 12;
      ctx.strokeRect(0, 0, 256, 256);

      const isOne = (val === 1);
      const pipRadius = isOne ? 44 : 23;
      const pipColor = isOne ? '#e02418' : '#141517';

      const pips = {
        1: [[128, 128]],
        2: [[68, 68], [188, 188]],
        3: [[68, 68], [188, 188]],
        3: [[68, 68], [128, 128], [188, 188]],
        4: [[68, 68], [188, 68], [68, 188], [188, 188]],
        5: [[66, 66], [190, 66], [128, 128], [66, 190], [190, 190]],
        6: [[68, 62], [188, 62], [68, 128], [188, 128], [68, 194], [188, 194]]
      }[val];

      pips.forEach(([x, y]) => {
        ctx.beginPath();
        ctx.arc(x, y, pipRadius, 0, Math.PI * 2);
        ctx.fillStyle = pipColor;
        ctx.fill();

        ctx.beginPath();
        ctx.arc(x - pipRadius * 0.2, y - pipRadius * 0.2, pipRadius * 0.35, 0, Math.PI * 2);
        ctx.fillStyle = isOne ? 'rgba(255,255,255,0.25)' : 'rgba(255,255,255,0.15)';
        ctx.fill();
      });

      return new THREE.CanvasTexture(c);
    }

    const materials = [
      new THREE.MeshLambertMaterial({ map: createDiceFaceTexture(2) }),
      new THREE.MeshLambertMaterial({ map: createDiceFaceTexture(5) }),
      new THREE.MeshLambertMaterial({ map: createDiceFaceTexture(3) }),
      new THREE.MeshLambertMaterial({ map: createDiceFaceTexture(4) }),
      new THREE.MeshLambertMaterial({ map: createDiceFaceTexture(1) }),
      new THREE.MeshLambertMaterial({ map: createDiceFaceTexture(6) })
    ];

    const FaceRotations = {
      1: new THREE.Euler(0, 0, 0),
      2: new THREE.Euler(0, -Math.PI / 2, 0),
      3: new THREE.Euler(Math.PI / 2, 0, 0),
      4: new THREE.Euler(-Math.PI / 2, 0, 0),
      5: new THREE.Euler(0, Math.PI / 2, 0),
      6: new THREE.Euler(0, Math.PI, 0)
    };

    // Three.js セットアップ
    const canvas = document.getElementById('webgl-canvas');
    const tray = document.getElementById('tray');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setSize(tray.clientWidth, tray.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(35, tray.clientWidth / tray.clientHeight, 0.1, 100);
    camera.position.set(0, 0, 7.8);
    camera.lookAt(0, 0, 0);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.95);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.45);
    dirLight.position.set(2, 6, 8);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    scene.add(dirLight);

    const floorGeo = new THREE.PlaneGeometry(15, 15);
    const floorMat = new THREE.ShadowMaterial({ opacity: 0.45 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.position.set(0, 0, -0.6);
    floor.receiveShadow = true;
    scene.add(floor);

    // 角丸ジオメトリ生成
    function createRoundedDiceGeometry(size = 1.3, radius = 0.2, segments = 7) {
      const geo = new THREE.BoxGeometry(size, size, size, segments, segments, segments);
      const pos = geo.attributes.position;
      const half = size / 2;
      const innerHalf = half - radius;

      for (let i = 0; i < pos.count; i++) {
        let x = pos.getX(i);
        let y = pos.getY(i);
        let z = pos.getZ(i);

        let cx = Math.max(-innerHalf, Math.min(innerHalf, x));
        let cy = Math.max(-innerHalf, Math.min(innerHalf, y));
        let cz = Math.max(-innerHalf, Math.min(innerHalf, z));

        let dx = x - cx;
        let dy = y - cy;
        let dz = z - cz;

        let len = Math.sqrt(dx * dx + dy * dy + dz * dz);
        if (len > 0) {
          pos.setXYZ(i, cx + (dx / len) * radius, cy + (dy / len) * radius, cz + (dz / len) * radius);
        }
      }
      geo.computeVertexNormals();
      return geo;
    }

    const roundedGeo = createRoundedDiceGeometry(1.3, 0.2, 7);
    const diceMesh = new THREE.Mesh(roundedGeo, materials);
    diceMesh.castShadow = true;
    
    // 【修正点】振る前は非表示にしてトレイ内の待機を無くす
    diceMesh.visible = false;
    scene.add(diceMesh);

    // ドロップアニメーション
    function animateSingleDrop(mesh, targetValue, onComplete) {
      mesh.visible = true; // 投下開始と同時に表示

      const startTime = performance.now();
      const duration = 1050;
      const startY = 4.5;
      const targetX = 0;

      const targetEuler = FaceRotations[targetValue];
      const targetQuat = new THREE.Quaternion().setFromEuler(targetEuler);

      const extraTurnsX = Math.floor(Math.random() * 2) + 3;
      const extraTurnsY = Math.floor(Math.random() * 2) + 3;
      const totalAngleX = extraTurnsX * Math.PI * 2;
      const totalAngleY = extraTurnsY * Math.PI * 2;

      const driftX = (Math.random() - 0.5) * 0.4;

      let soundBounced1 = false;
      let soundBounced2 = false;

      function frame(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);

        let y = 0;
        if (progress < 0.44) {
          const p = progress / 0.44;
          y = startY * (1 - p * p);
        } else if (progress < 0.74) {
          if (!soundBounced1) {
            AudioEngine.playHit(0.35, 170);
            soundBounced1 = true;
          }
          const p = (progress - 0.44) / 0.3;
          y = Math.sin(p * Math.PI) * 1.15;
        } else if (progress < 0.92) {
          if (!soundBounced2) {
            AudioEngine.playHit(0.2, 220);
            soundBounced2 = true;
          }
          const p = (progress - 0.74) / 0.18;
          y = Math.sin(p * Math.PI) * 0.3;
        } else {
          y = 0;
        }

        const easeProgress = 1 - Math.pow(1 - progress, 3);
        const remain = 1 - easeProgress;

        const rotX = targetEuler.x + totalAngleX * remain;
        const rotY = targetEuler.y + totalAngleY * remain;
        const rotZ = targetEuler.z + Math.sin(progress * Math.PI) * 0.35;

        mesh.rotation.set(rotX, rotY, rotZ);

        const currentX = targetX + driftX * remain;
        mesh.position.set(currentX, y, 0);

        if (progress < 1) {
          requestAnimationFrame(frame);
        } else {
          AudioEngine.playHit(0.08, 260);
          mesh.position.set(targetX, 0, 0);
          mesh.quaternion.copy(targetQuat);
          if (onComplete) onComplete();
        }
      }

      requestAnimationFrame(frame);
    }

    let isRolling = false;

    function renderLoop() {
      requestAnimationFrame(renderLoop);
      renderer.render(scene, camera);
    }
    renderLoop();

    function roll() {
      if (isRolling) return;
      isRolling = true;
      document.getElementById('result-text').textContent = "振っています...";

      const val = Math.floor(Math.random() * 6) + 1;

      animateSingleDrop(diceMesh, val, () => {
        isRolling = false;
        document.getElementById('result-text').textContent = `出目: [ ${val} ]`;
      });
    }

    document.getElementById('roll-btn').addEventListener('click', roll);
    document.getElementById('tray').addEventListener('click', roll);
  </script>
</body>
</html>
