<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Real 3D WebGL Dice Drop</title>
  <!-- Three.js (軽量3Dエンジン) をCDNから直読み -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #2e1509 0%, #0d0502 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: sans-serif;
    }
    .dice-tray {
      width: 350px;
      height: 280px;
      background: #143521;
      border: 10px solid #3a1a0b;
      border-radius: 16px;
      box-shadow: inset 0 0 35px rgba(0,0,0,0.85), 0 12px 30px rgba(0,0,0,0.8);
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }
    #webgl-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .ui-area {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .roll-trigger-btn {
      padding: 12px 36px;
      background: linear-gradient(180deg, #e8ca74 0%, #b88628 100%);
      color: #1a0b02;
      font-size: 1.1rem;
      font-weight: 900;
      border: 1px solid #fff2b2;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(212,175,55,0.4);
      transition: transform 0.1s;
    }
    .roll-trigger-btn:active {
      transform: scale(0.96);
    }
    .result-label {
      color: #f0ebd8;
      font-size: 1rem;
      font-weight: 700;
      min-height: 24px;
    }
  </style>
</head>
<body>

  <div class="dice-tray" id="tray">
    <canvas id="webgl-canvas"></canvas>
  </div>

  <div class="ui-area">
    <button class="roll-trigger-btn" id="roll-btn">サイコロを振る</button>
    <div class="result-label" id="result-text">出目: - , -</div>
  </div>

  <script>
    // Web Audio 着地・衝突衝撃音
    const AudioEngine = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AC();
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
      },
      playHit(vol = 0.3, pitch = 140) {
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(pitch + (Math.random() * 30 - 15), now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.05);
        gain.gain.setValueAtTime(vol, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.05);
      }
    };

    // --- 高解像度サイコロテクスチャ生成 (日本標準: 1の目が朱赤大丸) ---
    function createDiceFaceTexture(val) {
      const c = document.createElement('canvas');
      c.width = 256;
      c.height = 256;
      const ctx = c.getContext('2d');

      // 象牙ホワイトの丸みグラデーション背景
      const grad = ctx.createRadialGradient(128, 128, 20, 128, 128, 160);
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(0.85, '#f0eff2');
      grad.addColorStop(1, '#dadce0');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 256, 256);

      // 角の微細なアンビエントシャドウ
      ctx.strokeStyle = '#c5c8cf';
      ctx.lineWidth = 10;
      ctx.strokeRect(0, 0, 256, 256);

      const isOne = (val === 1);
      const pipRadius = isOne ? 42 : 22;
      const pipColor = isOne ? '#df2217' : '#141517';

      const pips = {
        1: [[128, 128]],
        2: [[68, 68], [188, 188]],
        3: [[68, 68], [128, 128], [188, 188]],
        4: [[68, 68], [188, 68], [68, 188], [188, 188]],
        5: [[64, 64], [192, 64], [128, 128], [64, 192], [192, 192]],
        6: [[68, 60], [188, 60], [68, 128], [188, 128], [68, 196], [188, 196]]
      }[val];

      pips.forEach(([x, y]) => {
        ctx.beginPath();
        ctx.arc(x, y, pipRadius, 0, Math.PI * 2);
        ctx.fillStyle = pipColor;
        ctx.fill();

        // 目の中の立体彫り込みハイライト
        ctx.beginPath();
        ctx.arc(x - pipRadius * 0.25, y - pipRadius * 0.25, pipRadius * 0.35, 0, Math.PI * 2);
        ctx.fillStyle = isOne ? 'rgba(255,255,255,0.35)' : 'rgba(255,255,255,0.2)';
        ctx.fill();
      });

      return new THREE.CanvasTexture(c);
    }

    // Three.js標準のBoxFaceマッピング
    // [0:+X, 1:-X, 2:+Y, 3:-Y, 4:+Z, 5:-Z]
    // 1の反対面は6、2の反対面は5、3の反対面は4 (対面の和が7)
    const materials = [
      new THREE.MeshStandardMaterial({ map: createDiceFaceTexture(2), roughness: 0.25, metalness: 0.05 }),
      new THREE.MeshStandardMaterial({ map: createDiceFaceTexture(5), roughness: 0.25, metalness: 0.05 }),
      new THREE.MeshStandardMaterial({ map: createDiceFaceTexture(3), roughness: 0.25, metalness: 0.05 }),
      new THREE.MeshStandardMaterial({ map: createDiceFaceTexture(4), roughness: 0.25, metalness: 0.05 }),
      new THREE.MeshStandardMaterial({ map: createDiceFaceTexture(1), roughness: 0.25, metalness: 0.05 }),
      new THREE.MeshStandardMaterial({ map: createDiceFaceTexture(6), roughness: 0.25, metalness: 0.05 })
    ];

    // 出目（1〜6）を手前(+Z)に向けるクォータニオン回転
    const FaceRotations = {
      1: { x: 0, y: 0, z: 0 },
      2: { x: 0, y: -Math.PI / 2, z: 0 },
      3: { x: Math.PI / 2, y: 0, z: 0 },
      4: { x: -Math.PI / 2, y: 0, z: 0 },
      5: { x: 0, y: Math.PI / 2, z: 0 },
      6: { x: 0, y: Math.PI, z: 0 }
    };

    // --- Three.js シーン初期化 ---
    const canvas = document.getElementById('webgl-canvas');
    const tray = document.getElementById('tray');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setSize(tray.clientWidth, tray.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, tray.clientWidth / tray.clientHeight, 0.1, 100);
    camera.position.set(0, 0, 8.5);
    camera.lookAt(0, 0, 0);

    // ライティング（スタジオ風の高級感ある陰影）
    const ambientLight = new THREE.AmbientLight(0xfff5e6, 0.85);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(3, 8, 8);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    scene.add(dirLight);

    // 盤面フェルト床（影を受ける板）
    const floorGeo = new THREE.PlaneGeometry(15, 15);
    const floorMat = new THREE.ShadowMaterial({ opacity: 0.45 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.position.z = -0.65;
    floor.receiveShadow = true;
    scene.add(floor);

    // 本物の角丸3Dキューブメッシュの生成
    function createDiceMesh() {
      // BoxGeometry (1.25x1.25x1.25)
      const geo = new THREE.BoxGeometry(1.25, 1.25, 1.25);
      const mesh = new THREE.Mesh(geo, materials);
      mesh.castShadow = true;
      mesh.receiveShadow = false;
      return mesh;
    }

    const diceMesh1 = createDiceMesh();
    const diceMesh2 = createDiceMesh();
    scene.add(diceMesh1);
    scene.add(diceMesh2);

    // 物理シミュレータ
    class PhysicalDie {
      constructor(mesh, baseTargetX) {
        this.mesh = mesh;
        this.baseTargetX = baseTargetX;
        this.active = false;
        this.settled = true;
        this.mesh.position.set(this.baseTargetX, 0, 0);
      }

      drop(targetValue, delay = 0) {
        this.targetValue = targetValue;
        this.active = false;
        this.settled = false;

        setTimeout(() => {
          this.active = true;
          // 上空・手前から落下
          this.mesh.position.set(
            this.baseTargetX + (Math.random() - 0.5) * 0.8,
            3.5 + Math.random() * 0.5,
            3.0
          );
          // 速度
          this.vx = (this.baseTargetX - this.mesh.position.x) * 0.05;
          this.vy = -0.15;
          this.vz = -0.18;
          // 角速度 (ランダム高速タンブリング)
          this.rx = (Math.random() - 0.5) * 0.5;
          this.ry = (Math.random() - 0.5) * 0.5;
          this.rz = (Math.random() - 0.5) * 0.5;
          this.bounces = 0;
        }, delay);
      }

      update() {
        if (!this.active || this.settled) return;

        // 重力加速
        this.vy -= 0.009;
        this.vz -= 0.008;

        this.mesh.position.x += this.vx;
        this.mesh.position.y += this.vy;
        this.mesh.position.z += this.vz;

        // 回転適用
        this.mesh.rotation.x += this.rx;
        this.mesh.rotation.y += this.ry;
        this.mesh.rotation.z += this.rz;

        // 盤面 (z = 0) 衝突判定
        if (this.mesh.position.z <= 0) {
          this.mesh.position.z = 0;
          this.bounces++;

          if (this.bounces === 1) {
            AudioEngine.playHit(0.35, 170);
            this.vz = -this.vz * 0.42; // 第1バウンド反発
            this.vy = -this.vy * 0.3;
            this.rx *= 0.6;
            this.ry *= 0.6;
          } else if (this.bounces === 2) {
            AudioEngine.playHit(0.2, 220);
            this.vz = -this.vz * 0.3; // 第2バウンド
            this.rx *= 0.3;
            this.ry *= 0.3;
          } else {
            // 静止フェーズ：指定の出目へ吸着補間
            AudioEngine.playHit(0.08, 260);
            this.settled = true;
            this.alignToTarget();
          }
        }
      }

      alignToTarget() {
        const targetRot = FaceRotations[this.targetValue];
        // 目的の角度へスムーズに吸着
        this.mesh.rotation.set(targetRot.x, targetRot.y, targetRot.z);
        this.mesh.position.z = 0;
      }
    }

    const pDie1 = new PhysicalDie(diceMesh1, -1.2);
    const pDie2 = new PhysicalDie(diceMesh2, 1.2);

    let isRolling = false;

    // レンダリングループ
    function animate() {
      requestAnimationFrame(animate);

      pDie1.update();
      pDie2.update();

      if (isRolling && pDie1.settled && pDie2.settled) {
        isRolling = false;
        document.getElementById('result-text').textContent = `出目: [ ${pDie1.targetValue} ] , [ ${pDie2.targetValue} ]`;
      }

      renderer.render(scene, camera);
    }
    animate();

    function roll() {
      if (isRolling) return;
      isRolling = true;
      document.getElementById('result-text').textContent = "振っています...";

      const v1 = Math.floor(Math.random() * 6) + 1;
      const v2 = Math.floor(Math.random() * 6) + 1;

      pDie1.drop(v1, 0);
      pDie2.drop(v2, 60);
    }

    document.getElementById('roll-btn').addEventListener('click', roll);
    document.getElementById('tray').addEventListener('click', roll);
  </script>
</body>
</html>
