<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Real 3D Rounded Dice</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #2e1509 0%, #0d0502 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: sans-serif;
    }
    .dice-tray {
      width: 350px;
      height: 280px;
      background: #143521;
      border: 10px solid #3a1a0b;
      border-radius: 16px;
      box-shadow: inset 0 0 35px rgba(0,0,0,0.85), 0 12px 30px rgba(0,0,0,0.8);
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }
    #webgl-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .ui-area {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .roll-trigger-btn {
      padding: 12px 36px;
      background: linear-gradient(180deg, #e8ca74 0%, #b88628 100%);
      color: #1a0b02;
      font-size: 1.1rem;
      font-weight: 900;
      border: 1px solid #fff2b2;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(212,175,55,0.4);
      transition: transform 0.1s;
    }
    .roll-trigger-btn:active {
      transform: scale(0.96);
    }
    .result-label {
      color: #f0ebd8;
      font-size: 1rem;
      font-weight: 700;
      min-height: 24px;
    }
  </style>
</head>
<body>

  <div class="dice-tray" id="tray">
    <canvas id="webgl-canvas"></canvas>
  </div>

  <div class="ui-area">
    <button class="roll-trigger-btn" id="roll-btn">サイコロを振る</button>
    <div class="result-label" id="result-text">出目: - , -</div>
  </div>

  <script>
    // Web Audio 打撃音
    const AudioEngine = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AC();
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
      },
      playHit(vol = 0.3, pitch = 140) {
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(pitch + (Math.random() * 30 - 15), now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.05);
        gain.gain.setValueAtTime(vol, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.05);
      }
    };

    // --- 高解像度サイコロテクスチャ (角丸マスク＆立体ハイライト付き) ---
    function createDiceFaceTexture(val) {
      const c = document.createElement('canvas');
      c.width = 256;
      c.height = 256;
      const ctx = c.getContext('2d');

      // 象牙ホワイトの丸みグラデーション
      const grad = ctx.createRadialGradient(128, 128, 10, 128, 128, 150);
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(0.8, '#f5f4f7');
      grad.addColorStop(1, '#dbdce0');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 256, 256);

      // 角の丸みシャドウ
      ctx.strokeStyle = '#c6c9cf';
      ctx.lineWidth = 14;
      ctx.strokeRect(0, 0, 256, 256);

      const isOne = (val === 1);
      const pipRadius = isOne ? 44 : 23;
      const pipColor = isOne ? '#e02418' : '#151618';

      const pips = {
        1: [[128, 128]],
        2: [[68, 68], [188, 188]],
        3: [[68, 68], [128, 128], [188, 188]],
        4: [[68, 68], [188, 68], [68, 188], [188, 188]],
        5: [[66, 66], [190, 66], [128, 128], [66, 190], [190, 190]],
        6: [[68, 62], [188, 62], [68, 128], [188, 128], [68, 194], [188, 194]]
      }[val];

      pips.forEach(([x, y]) => {
        ctx.beginPath();
        ctx.arc(x, y, pipRadius, 0, Math.PI * 2);
        ctx.fillStyle = pipColor;
        ctx.fill();

        // 彫り込みハイライト
        ctx.beginPath();
        ctx.arc(x - pipRadius * 0.25, y - pipRadius * 0.25, pipRadius * 0.35, 0, Math.PI * 2);
        ctx.fillStyle = isOne ? 'rgba(255,255,255,0.4)' : 'rgba(255,255,255,0.25)';
        ctx.fill();
      });

      return new THREE.CanvasTexture(c);
    }

    // 各面のマテリアル [0:+X(2), 1:-X(5), 2:+Y(3), 3:-Y(4), 4:+Z(1), 5:-Z(6)]
    const materials = [
      new THREE.MeshStandardMaterial({ map: createDiceFaceTexture(2), roughness: 0.2, metalness: 0.05 }),
      new THREE.MeshStandardMaterial({ map: createDiceFaceTexture(5), roughness: 0.2, metalness: 0.05 }),
      new THREE.MeshStandardMaterial({ map: createDiceFaceTexture(3), roughness: 0.2, metalness: 0.05 }),
      new THREE.MeshStandardMaterial({ map: createDiceFaceTexture(4), roughness: 0.2, metalness: 0.05 }),
      new THREE.MeshStandardMaterial({ map: createDiceFaceTexture(1), roughness: 0.2, metalness: 0.05 }),
      new THREE.MeshStandardMaterial({ map: createDiceFaceTexture(6), roughness: 0.2, metalness: 0.05 })
    ];

    // 出目（1〜6）を手前（カメラ正面）に向ける回転角度
    const FaceRotations = {
      1: { x: 0, y: 0, z: 0 },
      2: { x: 0, y: -Math.PI / 2, z: 0 },
      3: { x: Math.PI / 2, y: 0, z: 0 },
      4: { x: -Math.PI / 2, y: 0, z: 0 },
      5: { x: 0, y: Math.PI / 2, z: 0 },
      6: { x: 0, y: Math.PI, z: 0 }
    };

    // --- Three.js セットアップ ---
    const canvas = document.getElementById('webgl-canvas');
    const tray = document.getElementById('tray');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setSize(tray.clientWidth, tray.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    
    // カメラ：トレイの中央(0, 0, 0)を斜め上から綺麗に見下ろすアングル
    const camera = new THREE.PerspectiveCamera(36, tray.clientWidth / tray.clientHeight, 0.1, 100);
    camera.position.set(0, -3.2, 7.5);
    camera.lookAt(0, 0.2, 0);

    // 照明
    const ambientLight = new THREE.AmbientLight(0xfff5e6, 0.9);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.3);
    dirLight.position.set(4, 5, 8);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    scene.add(dirLight);

    // 床面シャドウ
    const floorGeo = new THREE.PlaneGeometry(15, 15);
    const floorMat = new THREE.ShadowMaterial({ opacity: 0.5 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.position.set(0, 0, -0.6);
    floor.receiveShadow = true;
    scene.add(floor);

    // --- 本物の角丸立体ダイス（球体変形・面取り）の生成 ---
    function createRoundedDiceGeometry(size = 1.15, radius = 0.16, segments = 6) {
      // 基準ジオメトリ（面取り用に分割数を増やす）
      const geo = new THREE.BoxGeometry(size, size, size, segments, segments, segments);
      const pos = geo.attributes.position;
      const half = size / 2;
      const innerHalf = half - radius;

      // 頂点を外側の角だけ丸くクランプ変形
      for (let i = 0; i < pos.count; i++) {
        let x = pos.getX(i);
        let y = pos.getY(i);
        let z = pos.getZ(i);

        let cx = Math.max(-innerHalf, Math.min(innerHalf, x));
        let cy = Math.max(-innerHalf, Math.min(innerHalf, y));
        let cz = Math.max(-innerHalf, Math.min(innerHalf, z));

        let dx = x - cx;
        let dy = y - cy;
        let dz = z - cz;

        let len = Math.sqrt(dx * dx + dy * dy + dz * dz);
        if (len > 0) {
          pos.setXYZ(i, cx + (dx / len) * radius, cy + (dy / len) * radius, cz + (dz / len) * radius);
        }
      }
      geo.computeVertexNormals();
      return geo;
    }

    const roundedGeo = createRoundedDiceGeometry(1.2, 0.2, 7);
    const diceMesh1 = new THREE.Mesh(roundedGeo, materials);
    const diceMesh2 = new THREE.Mesh(roundedGeo, materials);
    diceMesh1.castShadow = true;
    diceMesh2.castShadow = true;
    scene.add(diceMesh1);
    scene.add(diceMesh2);

    // 物理シミュレータ
    class PhysicalDie {
      constructor(mesh, restX, restY) {
        this.mesh = mesh;
        this.restX = restX; // 最終的に静止する中央X
        this.restY = restY; // 最終的に静止する中央Y (0.2)
        this.active = false;
        this.settled = true;
        this.mesh.position.set(this.restX, this.restY, 0);
      }

      drop(targetValue, delay = 0) {
        this.targetValue = targetValue;
        this.active = false;
        this.settled = false;

        setTimeout(() => {
          this.active = true;
          // 上空（Y=2.8）から落下開始
          this.mesh.position.set(
            this.restX + (Math.random() - 0.5) * 0.6,
            2.8 + Math.random() * 0.4,
            2.5
          );
          // 速度：中央に向かって収束するベクトル
          this.vx = (this.restX - this.mesh.position.x) * 0.05;
          this.vy = -0.11;
          this.vz = -0.16;

          // ランダムタンブリング
          this.rx = (Math.random() - 0.5) * 0.45;
          this.ry = (Math.random() - 0.5) * 0.45;
          this.rz = (Math.random() - 0.5) * 0.45;
          this.bounces = 0;
        }, delay);
      }

      update() {
        if (!this.active || this.settled) return;

        // 重力
        this.vz -= 0.011;
        this.vy += (this.restY - this.mesh.position.y) * 0.04; // 中央Yへ引き寄せ
        this.vx += (this.restX - this.mesh.position.x) * 0.04; // 中央Xへ引き寄せ

        this.mesh.position.x += this.vx;
        this.mesh.position.y += this.vy;
        this.mesh.position.z += this.vz;

        this.mesh.rotation.x += this.rx;
        this.mesh.rotation.y += this.ry;
        this.mesh.rotation.z += this.rz;

        // 盤面 (z=0) 衝突バウンド
        if (this.mesh.position.z <= 0) {
          this.mesh.position.z = 0;
          this.bounces++;

          if (this.bounces === 1) {
            AudioEngine.playHit(0.35, 170);
            this.vz = -this.vz * 0.42;
            this.vy *= 0.4;
            this.rx *= 0.5;
            this.ry *= 0.5;
          } else if (this.bounces === 2) {
            AudioEngine.playHit(0.2, 220);
            this.vz = -this.vz * 0.32;
            this.rx *= 0.3;
            this.ry *= 0.3;
          } else {
            // 静止（トレイのド真ん中・目的の出目で着地）
            AudioEngine.playHit(0.08, 260);
            this.settled = true;
            this.alignToTarget();
          }
        }
      }

      alignToTarget() {
        const targetRot = FaceRotations[this.targetValue];
        // わずかな自然な傾き（Z軸に数度）をつけて中央に静止
        const subtleAngle = (this.restX < 0 ? -1 : 1) * 0.12;
        this.mesh.rotation.set(targetRot.x, targetRot.y, targetRot.z + subtleAngle);
        this.mesh.position.set(this.restX, this.restY, 0);
      }
    }

    // トレイ中央（左右にバランスよく配置：X = -1.0, +1.0 / Y = 0.2）
    const pDie1 = new PhysicalDie(diceMesh1, -1.05, 0.2);
    const pDie2 = new PhysicalDie(diceMesh2, 1.05, 0.2);

    let isRolling = false;

    function animate() {
      requestAnimationFrame(animate);

      pDie1.update();
      pDie2.update();

      if (isRolling && pDie1.settled && pDie2.settled) {
        isRolling = false;
        document.getElementById('result-text').textContent = `出目: [ ${pDie1.targetValue} ] , [ ${pDie2.targetValue} ]`;
      }

      renderer.render(scene, camera);
    }
    animate();

    function roll() {
      if (isRolling) return;
      isRolling = true;
      document.getElementById('result-text').textContent = "振っています...";

      const v1 = Math.floor(Math.random() * 6) + 1;
      const v2 = Math.floor(Math.random() * 6) + 1;

      pDie1.drop(v1, 0);
      pDie2.drop(v2, 60);
    }

    document.getElementById('roll-btn').addEventListener('click', roll);
    document.getElementById('tray').addEventListener('click', roll);
  </script>
</body>
</html>
