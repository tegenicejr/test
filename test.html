<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real 3D Dice Drop Demo</title>
  <style>
    :root {
      --felt-bg: #143521;
      --wood-rim: #220f05;
      --brass: #d4af37;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #2e1509 0%, #110703 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: sans-serif;
    }

    /* 盤面風のサイコロ落下トレイ */
    .dice-tray {
      width: 360px;
      height: 280px;
      background: var(--felt-bg);
      border: 10px solid #3a1a0b;
      border-radius: 16px;
      box-shadow: inset 0 0 35px rgba(0,0,0,0.85), 0 12px 30px rgba(0,0,0,0.8);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1000px;
      overflow: hidden;
    }

    .dice-stage {
      width: 240px;
      height: 120px;
      position: relative;
      display: flex;
      justify-content: space-around;
      align-items: center;
      transform-style: preserve-3d;
    }

    /* サイコロの影 */
    .dice-wrapper {
      position: relative;
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .dice-shadow {
      position: absolute;
      bottom: -16px;
      width: 50px;
      height: 18px;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0) 75%);
      border-radius: 50%;
      pointer-events: none;
      transform: scale(0.3);
      opacity: 0;
      transition: transform 0.1s linear, opacity 0.1s linear;
    }

    /* 3Dサイコロ本体キューブ */
    .dice-cube {
      width: 50px;
      height: 50px;
      position: relative;
      transform-style: preserve-3d;
      transform: translateY(0);
      will-change: transform;
    }

    /* 日本の標準仕様サイコロ（白地・角丸・立体陰影） */
    .dice-face {
      position: absolute;
      width: 50px;
      height: 50px;
      background: radial-gradient(circle at 35% 35%, #ffffff 0%, #f4f3f6 70%, #d8d9de 100%);
      border-radius: 10px;
      border: 1px solid #c9ccd1;
      box-shadow: inset 0 2px 3px #ffffff, inset 0 -2px 3px #b2b5ba, 0 0 4px rgba(0,0,0,0.15);
      display: grid;
      grid-template: repeat(3, 1fr) / repeat(3, 1fr);
      padding: 6px;
      backface-visibility: hidden; /* 裏面の突き破りチラつきを完全に根絶 */
      -webkit-backface-visibility: hidden;
    }

    /* 各面の配置 (中心から24.8pxオフセットで継ぎ目の重なりを最適化) */
    .face-1 { transform: rotateY(0deg) translateZ(24.8px); }
    .face-2 { transform: rotateY(90deg) translateZ(24.8px); }
    .face-3 { transform: rotateX(-90deg) translateZ(24.8px); }
    .face-4 { transform: rotateX(90deg) translateZ(24.8px); }
    .face-5 { transform: rotateY(-90deg) translateZ(24.8px); }
    .face-6 { transform: rotateY(180deg) translateZ(24.8px); }

    /* ピップ（ドット） */
    .pip {
      width: 9px;
      height: 9px;
      background: #111111;
      border-radius: 50%;
      align-self: center;
      justify-self: center;
      box-shadow: inset 0 1px 1px rgba(0,0,0,0.8);
    }

    /* 1の目：朱赤＆大丸 */
    .face-1 .pip-red {
      grid-column: 2;
      grid-row: 2;
      width: 17px;
      height: 17px;
      background: #df2217;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.4);
    }

    .p1 { grid-column: 1; grid-row: 1; }
    .p2 { grid-column: 3; grid-row: 1; }
    .p3 { grid-column: 2; grid-row: 2; }
    .p4 { grid-column: 1; grid-row: 3; }
    .p5 { grid-column: 3; grid-row: 3; }
    .p-mid-l { grid-column: 1; grid-row: 2; }
    .p-mid-r { grid-column: 3; grid-row: 2; }

    /* 操作UI */
    .ui-area {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .roll-trigger-btn {
      padding: 12px 36px;
      background: linear-gradient(180deg, #e8ca74 0%, #b88628 100%);
      color: #1a0b02;
      font-size: 1.1rem;
      font-weight: 900;
      border: 1px solid #fff2b2;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(212,175,55,0.4);
      transition: transform 0.1s;
    }

    .roll-trigger-btn:active {
      transform: scale(0.96);
    }

    .result-label {
      color: #f0ebd8;
      font-size: 1rem;
      font-weight: 700;
      min-height: 24px;
    }
  </style>
</head>
<body>

  <div class="dice-tray" id="tray">
    <div class="dice-stage">
      
      <!-- サイコロ 1 -->
      <div class="dice-wrapper" id="wrap-1">
        <div class="dice-shadow" id="shadow-1"></div>
        <div class="dice-cube" id="cube-1">
          <div class="dice-face face-1"><div class="pip pip-red"></div></div>
          <div class="dice-face face-2"><div class="pip p1"></div><div class="pip p5"></div></div>
          <div class="dice-face face-3"><div class="pip p1"></div><div class="pip p3"></div><div class="pip p5"></div></div>
          <div class="dice-face face-4"><div class="pip p1"></div><div class="pip p2"></div><div class="pip p4"></div><div class="pip p5"></div></div>
          <div class="dice-face face-5"><div class="pip p1"></div><div class="pip p2"></div><div class="pip p3"></div><div class="pip p4"></div><div class="pip p5"></div></div>
          <div class="dice-face face-6"><div class="pip p1"></div><div class="pip p2"></div><div class="pip p-mid-l"></div><div class="pip p-mid-r"></div><div class="pip p4"></div><div class="pip p5"></div></div>
        </div>
      </div>

      <!-- サイコロ 2 -->
      <div class="dice-wrapper" id="wrap-2">
        <div class="dice-shadow" id="shadow-2"></div>
        <div class="dice-cube" id="cube-2">
          <div class="dice-face face-1"><div class="pip pip-red"></div></div>
          <div class="dice-face face-2"><div class="pip p1"></div><div class="pip p5"></div></div>
          <div class="dice-face face-3"><div class="pip p1"></div><div class="pip p3"></div><div class="pip p5"></div></div>
          <div class="dice-face face-4"><div class="pip p1"></div><div class="pip p2"></div><div class="pip p4"></div><div class="pip p5"></div></div>
          <div class="dice-face face-5"><div class="pip p1"></div><div class="pip p2"></div><div class="pip p3"></div><div class="pip p4"></div><div class="pip p5"></div></div>
          <div class="dice-face face-6"><div class="pip p1"></div><div class="pip p2"></div><div class="pip p-mid-l"></div><div class="pip p-mid-r"></div><div class="pip p4"></div><div class="pip p5"></div></div>
        </div>
      </div>

    </div>
  </div>

  <div class="ui-area">
    <button class="roll-trigger-btn" id="roll-btn">サイコロを振る</button>
    <div class="result-label" id="result-text">出目: - , -</div>
  </div>

  <script>
    const AudioEngine = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AC();
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
      },
      playHit(volume = 0.3, pitch = 140) {
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(pitch + (Math.random() * 40 - 20), now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.05);

        gain.gain.setValueAtTime(volume, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + 0.05);
      }
    };

    const FaceRotations = {
      1: { x: 0,   y: 0 },
      2: { x: 0,   y: -90 },
      3: { x: 90,  y: 0 },
      4: { x: -90, y: 0 },
      5: { x: 0,   y: 90 },
      6: { x: 0,   y: 180 }
    };

    let isRolling = false;

    function animateDiceDrop(cubeEl, shadowEl, targetValue, delay = 0, onComplete) {
      setTimeout(() => {
        const startTime = performance.now();
        const duration = 950;
        const startY = -280;
        
        const targetRot = FaceRotations[targetValue];
        const extraSpinsX = (Math.floor(Math.random() * 2) + 3) * 360;
        const extraSpinsY = (Math.floor(Math.random() * 2) + 3) * 360;
        const totalRotX = extraSpinsX + targetRot.x;
        const totalRotY = extraSpinsY + targetRot.y;

        const driftX = (Math.random() - 0.5) * 35;

        let soundBounced1 = false;
        let soundBounced2 = false;

        function frame(now) {
          const elapsed = now - startTime;
          const progress = Math.min(elapsed / duration, 1);

          let y = 0;
          if (progress < 0.45) {
            const p = progress / 0.45;
            y = startY * (1 - p * p);
          } else if (progress < 0.75) {
            if (!soundBounced1) {
              AudioEngine.playHit(0.35, 170);
              soundBounced1 = true;
            }
            const p = (progress - 0.45) / 0.3;
            y = -Math.sin(p * Math.PI) * 70;
          } else if (progress < 0.92) {
            if (!soundBounced2) {
              AudioEngine.playHit(0.2, 220);
              soundBounced2 = true;
            }
            const p = (progress - 0.75) / 0.17;
            y = -Math.sin(p * Math.PI) * 20;
          } else {
            y = 0;
          }

          const easeRot = 1 - Math.pow(1 - progress, 3);
          const currentRotX = totalRotX * easeRot;
          const currentRotY = totalRotY * easeRot;
          const currentRotZ = Math.sin(progress * Math.PI) * 20;
          const currentDrift = driftX * easeRot;

          cubeEl.style.transform = `translate3d(${currentDrift}px, ${y}px, 0) rotateX(${currentRotX}deg) rotateY(${currentRotY}deg) rotateZ(${currentRotZ}deg)`;

          const distFromGround = Math.abs(y);
          const shadowScale = Math.max(0.2, 1 - (distFromGround / 280) * 0.8);
          const shadowOpacity = Math.max(0, 0.75 - (distFromGround / 280) * 0.7);
          shadowEl.style.transform = `translate3d(${currentDrift}px, 0, 0) scale(${shadowScale})`;
          shadowEl.style.opacity = shadowOpacity;

          if (progress < 1) {
            requestAnimationFrame(frame);
          } else {
            AudioEngine.playHit(0.1, 260);
            cubeEl.style.transform = `translate3d(${driftX}px, 0, 0) rotateX(${targetRot.x}deg) rotateY(${targetRot.y}deg) rotateZ(0deg)`;
            shadowEl.style.transform = `translate3d(${driftX}px, 0, 0) scale(1)`;
            shadowEl.style.opacity = '0.75';
            if (onComplete) onComplete();
          }
        }

        requestAnimationFrame(frame);
      }, delay);
    }

    function roll() {
      if (isRolling) return;
      isRolling = true;
      document.getElementById('result-text').textContent = "振っています...";

      const cube1 = document.getElementById('cube-1');
      const shadow1 = document.getElementById('shadow-1');
      const cube2 = document.getElementById('cube-2');
      const shadow2 = document.getElementById('shadow-2');

      const val1 = Math.floor(Math.random() * 6) + 1;
      const val2 = Math.floor(Math.random() * 6) + 1;

      let finishedCount = 0;
      const checkDone = () => {
        finishedCount++;
        if (finishedCount === 2) {
          isRolling = false;
          document.getElementById('result-text').textContent = `出目: [ ${val1} ] , [ ${val2} ]`;
        }
      };

      animateDiceDrop(cube1, shadow1, val1, 0, checkDone);
      animateDiceDrop(cube2, shadow2, val2, 45, checkDone);
    }

    document.getElementById('roll-btn').addEventListener('click', roll);
    document.getElementById('tray').addEventListener('click', roll);
  </script>
</body>
</html>
