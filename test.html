<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real Dice Drop</title>
  <style>
    :root {
      --felt-bg: #143521;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #2e1509 0%, #110703 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: sans-serif;
    }
    .dice-tray {
      width: 340px;
      height: 280px;
      background: var(--felt-bg);
      border: 10px solid #3a1a0b;
      border-radius: 16px;
      box-shadow: inset 0 0 35px rgba(0,0,0,0.85), 0 12px 30px rgba(0,0,0,0.8);
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .ui-area {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .roll-trigger-btn {
      padding: 12px 36px;
      background: linear-gradient(180deg, #e8ca74 0%, #b88628 100%);
      color: #1a0b02;
      font-size: 1.1rem;
      font-weight: 900;
      border: 1px solid #fff2b2;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(212,175,55,0.4);
      transition: transform 0.1s;
    }
    .roll-trigger-btn:active {
      transform: scale(0.96);
    }
    .result-label {
      color: #f0ebd8;
      font-size: 1rem;
      font-weight: 700;
      min-height: 24px;
    }
  </style>
</head>
<body>

  <div class="dice-tray" id="tray">
    <canvas id="dice-canvas" width="680" height="560"></canvas>
  </div>

  <div class="ui-area">
    <button class="roll-trigger-btn" id="roll-btn">サイコロを振る</button>
    <div class="result-label" id="result-text">出目: - , -</div>
  </div>

  <script>
    const AudioEngine = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AC();
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
      },
      playHit(vol = 0.3, pitch = 140) {
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(pitch + (Math.random() * 30 - 15), now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.05);
        gain.gain.setValueAtTime(vol, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.05);
      }
    };

    const canvas = document.getElementById('dice-canvas');
    const ctx = canvas.getContext('2d');

    const pipMaps = {
      1: [[0, 0]],
      2: [[-0.25, -0.25], [0.25, 0.25]],
      3: [[-0.26, -0.26], [0, 0], [0.26, 0.26]],
      4: [[-0.25, -0.25], [0.25, -0.25], [-0.25, 0.25], [0.25, 0.25]],
      5: [[-0.26, -0.26], [0.26, -0.26], [0, 0], [-0.26, 0.26], [0.26, 0.26]],
      6: [[-0.25, -0.28], [0.25, -0.28], [-0.25, 0], [0.25, 0], [-0.25, 0.28], [0.25, 0.28]]
    };

    function drawRoundedDie(ctx, x, y, size, angle, value, tiltY = 1) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.scale(1, tiltY);

      const half = size / 2;
      const radius = size * 0.2;

      // 外枠の影
      ctx.shadowColor = 'rgba(0, 0, 0, 0.35)';
      ctx.shadowBlur = size * 0.1;
      ctx.shadowOffsetY = size * 0.06;

      // 本体ベース
      ctx.beginPath();
      ctx.roundRect(-half, -half, size, size, radius);
      const grad = ctx.createLinearGradient(-half, -half, half, half);
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(0.7, '#f4f4f6');
      grad.addColorStop(1, '#dbdce0');
      ctx.fillStyle = grad;
      ctx.fill();

      ctx.shadowColor = 'transparent';
      ctx.lineWidth = size * 0.03;
      ctx.strokeStyle = '#c5c8cf';
      ctx.stroke();

      // ピップ描画
      const pips = pipMaps[value] || pipMaps[1];
      const isOne = (value === 1);
      const pipRadius = isOne ? size * 0.17 : size * 0.095;

      pips.forEach(([px, py]) => {
        ctx.beginPath();
        const cx = px * size;
        const cy = py * size;
        ctx.arc(cx, cy, pipRadius, 0, Math.PI * 2);

        if (isOne) {
          ctx.fillStyle = '#df2217';
        } else {
          ctx.fillStyle = '#18191c';
        }
        ctx.fill();

        // 目の中の凹み立体感
        ctx.beginPath();
        ctx.arc(cx - pipRadius * 0.2, cy - pipRadius * 0.2, pipRadius * 0.4, 0, Math.PI * 2);
        ctx.fillStyle = isOne ? 'rgba(255,255,255,0.3)' : 'rgba(255,255,255,0.2)';
        ctx.fill();
      });

      ctx.restore();
    }

    function drawShadow(ctx, x, y, width, height, opacity) {
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(x, y, width, height, 0, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(0, 0, 0, ${opacity})`;
      ctx.fill();
      ctx.restore();
    }

    class DicePhysics {
      constructor(targetX, targetY) {
        this.targetX = targetX;
        this.targetY = targetY;
        this.reset();
      }

      reset() {
        this.x = this.targetX;
        this.y = -120;
        this.altitude = 450;
        this.vy = 0;
        this.rotation = Math.random() * Math.PI * 2;
        this.vRot = (Math.random() - 0.5) * 0.35;
        this.bounces = 0;
        this.val = Math.floor(Math.random() * 6) + 1;
        this.targetVal = 1;
        this.active = false;
        this.settled = false;
        this.tiltY = 1;
      }

      start(targetVal, delay = 0) {
        this.reset();
        this.targetVal = targetVal;
        this.x = this.targetX + (Math.random() - 0.5) * 60;
        setTimeout(() => {
          this.active = true;
          this.vy = 4;
        }, delay);
      }

      update() {
        if (!this.active || this.settled) return;

        // 重力落下
        this.vy += 1.4;
        this.altitude -= this.vy;

        // 空中での回転と出目の変化
        if (this.altitude > 10) {
          this.rotation += this.vRot;
          this.tiltY = 0.85 + Math.sin(this.altitude * 0.08) * 0.15;
          if (Math.random() < 0.25) {
            this.val = Math.floor(Math.random() * 6) + 1;
          }
        }

        // 盤面着地＆バウンド判定
        if (this.altitude <= 0) {
          this.altitude = 0;
          this.bounces++;

          if (this.bounces === 1) {
            AudioEngine.playHit(0.35, 160);
            this.vy = -this.vy * 0.42; // 第1バウンド
            this.vRot *= 0.6;
          } else if (this.bounces === 2) {
            AudioEngine.playHit(0.2, 210);
            this.vy = -this.vy * 0.35; // 第2バウンド
            this.vRot *= 0.4;
          } else {
            // 静止
            AudioEngine.playHit(0.08, 250);
            this.settled = true;
            this.val = this.targetVal;
            this.tiltY = 1;
            this.altitude = 0;
          }
        }

        // 目的位置への微収束
        this.x += (this.targetX - this.x) * 0.05;
      }

      draw() {
        const renderY = this.targetY - this.altitude;
        const baseSize = 88;
        // 浮いている時は少し拡大（遠近法）
        const scale = 1 + (this.altitude / 500) * 0.25;
        const currentSize = baseSize * scale;

        // 影
        const shadowScale = Math.max(0.2, 1 - (this.altitude / 450) * 0.6);
        const shadowOpacity = Math.max(0.05, 0.65 - (this.altitude / 450) * 0.5);
        drawShadow(ctx, this.x, this.targetY + baseSize * 0.45, (baseSize * 0.5) * shadowScale, (baseSize * 0.2) * shadowScale, shadowOpacity);

        // サイコロ本体
        drawRoundedDie(ctx, this.x, renderY, currentSize, this.rotation, this.val, this.tiltY);
      }
    }

    const dice1 = new DicePhysics(240, 300);
    const dice2 = new DicePhysics(440, 300);
    let isRolling = false;

    function renderLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      dice1.update();
      dice2.update();
      dice1.draw();
      dice2.draw();

      if (isRolling && dice1.settled && dice2.settled) {
        isRolling = false;
        document.getElementById('result-text').textContent = `出目: [ ${dice1.val} ] , [ ${dice2.val} ]`;
      }

      requestAnimationFrame(renderLoop);
    }
    requestAnimationFrame(renderLoop);

    function roll() {
      if (isRolling) return;
      isRolling = true;
      document.getElementById('result-text').textContent = "振っています...";

      const v1 = Math.floor(Math.random() * 6) + 1;
      const v2 = Math.floor(Math.random() * 6) + 1;

      dice1.start(v1, 0);
      dice2.start(v2, 60);
    }

    document.getElementById('roll-btn').addEventListener('click', roll);
    document.getElementById('tray').addEventListener('click', roll);
  </script>
</body>
</html>
