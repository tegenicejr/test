<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real 3D Dice Drop Demo (Refined)</title>
  <style>
    :root {
      --felt-bg: #143521;
      --wood-rim: #220f05;
      --brass: #d4af37;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #2e1509 0%, #110703 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: sans-serif;
    }

    /* 盤面風のサイコロトレイ（深度を広げて歪みを防止） */
    .dice-tray {
      width: 360px;
      height: 280px;
      background: var(--felt-bg);
      border: 10px solid #3a1a0b;
      border-radius: 16px;
      box-shadow: inset 0 0 35px rgba(0,0,0,0.85), 0 12px 30px rgba(0,0,0,0.8);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1400px; /* パースを緩やかにして側面歪みを抑制 */
      overflow: hidden;
    }

    .dice-stage {
      width: 240px;
      height: 120px;
      position: relative;
      display: flex;
      justify-content: space-around;
      align-items: center;
      transform-style: preserve-3d;
    }

    .dice-wrapper {
      position: relative;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .dice-shadow {
      position: absolute;
      bottom: -12px;
      width: 48px;
      height: 16px;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0.65) 0%, rgba(0,0,0,0) 75%);
      border-radius: 50%;
      pointer-events: none;
      transform: scale(0.2);
      opacity: 0;
    }

    /* 3Dサイコロキューブ */
    .dice-cube {
      width: 48px;
      height: 48px;
      position: relative;
      transform-style: preserve-3d;
      will-change: transform;
    }

    .dice-face {
      position: absolute;
      width: 48px;
      height: 48px;
      background: #fbfbfc;
      border-radius: 8px;
      border: 1px solid #d4d7db;
      box-shadow: inset 0 2px 3px #ffffff, inset 0 -2px 3px #b8bcbf, inset 0 0 1px rgba(0,0,0,0.2);
      display: grid;
      grid-template: repeat(3, 1fr) / repeat(3, 1fr);
      padding: 5px;
      backface-visibility: hidden;
    }

    /* 48pxの立方体（中心から24pxオフセット） */
    .face-1 { transform: rotateY(0deg) translateZ(24px); }
    .face-2 { transform: rotateY(90deg) translateZ(24px); }
    .face-3 { transform: rotateX(-90deg) translateZ(24px); }
    .face-4 { transform: rotateX(90deg) translateZ(24px); }
    .face-5 { transform: rotateY(-90deg) translateZ(24px); }
    .face-6 { transform: rotateY(180deg) translateZ(24px); }

    .pip {
      width: 8px;
      height: 8px;
      background: #111111;
      border-radius: 50%;
      align-self: center;
      justify-self: center;
    }

    .face-1 .pip-red {
      grid-column: 2;
      grid-row: 2;
      width: 16px;
      height: 16px;
      background: #e02418;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.3);
    }

    .p1 { grid-column: 1; grid-row: 1; }
    .p2 { grid-column: 3; grid-row: 1; }
    .p3 { grid-column: 2; grid-row: 2; }
    .p4 { grid-column: 1; grid-row: 3; }
    .p5 { grid-column: 3; grid-row: 3; }
    .p-mid-l { grid-column: 1; grid-row: 2; }
    .p-mid-r { grid-column: 3; grid-row: 2; }

    .ui-area {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .roll-trigger-btn {
      padding: 12px 36px;
      background: linear-gradient(180deg, #e8ca74 0%, #b88628 100%);
      color: #1a0b02;
      font-size: 1.1rem;
      font-weight: 900;
      border: 1px solid #fff2b2;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(212,175,55,0.4);
      transition: transform 0.1s;
    }

    .roll-trigger-btn:active {
      transform: scale(0.96);
    }

    .result-label {
      color: #f0ebd8;
      font-size: 1rem;
      font-weight: 700;
      min-height: 24px;
    }
  </style>
</head>
<body>

  <div class="dice-tray" id="tray">
    <div class="dice-stage">
      
      <!-- サイコロ 1 -->
      <div class="dice-wrapper">
        <div class="dice-shadow" id="shadow-1"></div>
        <div class="dice-cube" id="cube-1">
          <div class="dice-face face-1"><div class="pip pip-red"></div></div>
          <div class="dice-face face-2"><div class="pip p1"></div><div class="pip p5"></div></div>
          <div class="dice-face face-3"><div class="pip p1"></div><div class="pip p3"></div><div class="pip p5"></div></div>
          <div class="dice-face face-4"><div class="pip p1"></div><div class="pip p2"></div><div class="pip p4"></div><div class="pip p5"></div></div>
          <div class="dice-face face-5"><div class="pip p1"></div><div class="pip p2"></div><div class="pip p3"></div><div class="pip p4"></div><div class="pip p5"></div></div>
          <div class="dice-face face-6"><div class="pip p1"></div><div class="pip p2"></div><div class="pip p-mid-l"></div><div class="pip p-mid-r"></div><div class="pip p4"></div><div class="pip p5"></div></div>
        </div>
      </div>

      <!-- サイコロ 2 -->
      <div class="dice-wrapper">
        <div class="dice-shadow" id="shadow-2"></div>
        <div class="dice-cube" id="cube-2">
          <div class="dice-face face-1"><div class="pip pip-red"></div></div>
          <div class="dice-face face-2"><div class="pip p1"></div><div class="pip p5"></div></div>
          <div class="dice-face face-3"><div class="pip p1"></div><div class="pip p3"></div><div class="pip p5"></div></div>
          <div class="dice-face face-4"><div class="pip p1"></div><div class="pip p2"></div><div class="pip p4"></div><div class="pip p5"></div></div>
          <div class="dice-face face-5"><div class="pip p1"></div><div class="pip p2"></div><div class="pip p3"></div><div class="pip p4"></div><div class="pip p5"></div></div>
          <div class="dice-face face-6"><div class="pip p1"></div><div class="pip p2"></div><div class="pip p-mid-l"></div><div class="pip p-mid-r"></div><div class="pip p4"></div><div class="pip p5"></div></div>
        </div>
      </div>

    </div>
  </div>

  <div class="ui-area">
    <button class="roll-trigger-btn" id="roll-btn">サイコロを振る</button>
    <div class="result-label" id="result-text">出目: - , -</div>
  </div>

  <script>
    const AudioEngine = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AC();
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
      },
      playHit(vol = 0.3, pitch = 160) {
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(pitch, now);
        osc.frequency.exponentialRampToValueAtTime(35, now + 0.04);

        gain.gain.setValueAtTime(vol, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + 0.04);
      }
    };

    // 正確な面の基本回転角度
    const FaceRotations = {
      1: { x: 0,   y: 0 },
      2: { x: 0,   y: -90 },
      3: { x: 90,  y: 0 },
      4: { x: -90, y: 0 },
      5: { x: 0,   y: 90 },
      6: { x: 0,   y: 180 }
    };

    let isRolling = false;

    // 滑らかな物理イージング関数（3次減衰）
    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    function animateDiceDrop(cubeEl, shadowEl, targetVal, delay = 0, onComplete) {
      setTimeout(() => {
        const startTime = performance.now();
        const duration = 1000;
        const startY = -260; // 落下開始高度

        // 目標角度に向けて360度単位で回転数を加算（着地時に絶対にズレない）
        const target = FaceRotations[targetVal];
        const spinsX = 3 * 360; 
        const spinsY = 3 * 360;
        const totalRotX = spinsX + target.x;
        const totalRotY = spinsY + target.y;
        const driftX = (Math.random() - 0.5) * 35; // わずかな横ブレ

        let bounced1 = false;
        let bounced2 = false;

        function step(now) {
          const elapsed = now - startTime;
          const p = Math.min(elapsed / duration, 1);

          // 物理放物線バウンド計算
          let y = 0;
          if (p < 0.46) {
            // 自由落下
            const fallP = p / 0.46;
            y = startY * (1 - fallP * fallP);
          } else if (p < 0.76) {
            // 第1バウンド
            if (!bounced1) {
              AudioEngine.playHit(0.32, 175);
              bounced1 = true;
            }
            const b1 = (p - 0.46) / 0.30;
            y = -Math.sin(b1 * Math.PI) * 55;
          } else if (p < 0.94) {
            // 第2バウンド（微小減衰）
            if (!bounced2) {
              AudioEngine.playHit(0.18, 220);
              bounced2 = true;
            }
            const b2 = (p - 0.76) / 0.18;
            y = -Math.sin(b2 * Math.PI) * 14;
          } else {
            // 完全静止
            y = 0;
          }

          // 回転も同じ時間軸で目標値に完全同期（スナップのズレなし）
          const rotP = easeOutCubic(p);
          const rx = totalRotX * rotP;
          const ry = totalRotY * rotP;
          const rz = Math.sin(p * Math.PI) * (1 - p) * 18; // 落下中のみわずかなロール
          const curDrift = driftX * rotP;

          // 適用
          cubeEl.style.transform = `translate3d(${curDrift}px, ${y}px, 0) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg)`;

          // 影のスケールと透明度
          const dist = Math.abs(y);
          const shadowScale = Math.max(0.2, 1 - (dist / 260) * 0.75);
          const shadowOpacity = Math.max(0, 0.7 - (dist / 260) * 0.65);
          shadowEl.style.transform = `translate3d(${curDrift}px, 0, 0) scale(${shadowScale})`;
          shadowEl.style.opacity = shadowOpacity;

          if (p < 1) {
            requestAnimationFrame(step);
          } else {
            // 終了時：一切の角度急変を行わずそのまま自然静止
            AudioEngine.playHit(0.08, 250);
            cubeEl.style.transform = `translate3d(${driftX}px, 0, 0) rotateX(${totalRotX}deg) rotateY(${totalRotY}deg) rotateZ(0deg)`;
            shadowEl.style.transform = `translate3d(${driftX}px, 0, 0) scale(1)`;
            shadowEl.style.opacity = '0.7';
            if (onComplete) onComplete();
          }
        }

        requestAnimationFrame(step);
      }, delay);
    }

    function roll() {
      if (isRolling) return;
      isRolling = true;
      document.getElementById('result-text').textContent = "振っています...";

      const cube1 = document.getElementById('cube-1');
      const shadow1 = document.getElementById('shadow-1');
      const cube2 = document.getElementById('cube-2');
      const shadow2 = document.getElementById('shadow-2');

      const val1 = Math.floor(Math.random() * 6) + 1;
      const val2 = Math.floor(Math.random() * 6) + 1;

      let count = 0;
      const done = () => {
        count++;
        if (count === 2) {
          isRolling = false;
          document.getElementById('result-text').textContent = `出目: [ ${val1} ] , [ ${val2} ]`;
        }
      };

      animateDiceDrop(cube1, shadow1, val1, 0, done);
      animateDiceDrop(cube2, shadow2, val2, 60, done);
    }

    document.getElementById('roll-btn').addEventListener('click', roll);
    document.getElementById('tray').addEventListener('click', roll);
  </script>
</body>
</html>
